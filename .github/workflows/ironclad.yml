name: ironclad

# The gate, in CI — so a pull request cannot skip what the pre-commit hook enforces locally.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: Ironclad gate (packet)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the ledger checks read commit history

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: npm ci --no-audit --no-fund

      - name: Run the gate
        run: node .ironclad/gate.mjs --stage packet

      - name: Real PostgreSQL integration
        run: npm run test:postgres

      - name: PowerShell client and startup regressions
        shell: pwsh
        run: .\scripts\Test-PowerShell.ps1

      - name: Gate report (JSON)
        if: always()
        run: node .ironclad/gate.mjs --stage packet --no-run --json > ironclad-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ironclad-report-${{ matrix.os }}
          path: ironclad-report.json
          if-no-files-found: ignore
